name: Roadbreak Public Builder

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private Roadbreak branch/tag/commit to build"
        required: true
        default: "feat/visual-physics-recovery-v020"
        type: string
  push:
    branches:
      - main
    paths:
      - BUILD_REQUEST

concurrency:
  group: roadbreak-public-builder-v020
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: cybertran/Roadbreak-75
  GODOT_VERSION: "4.6.3"
  APK_NAME: "Roadbreak-75-debug.apk"
  SOURCE_REF: ${{ inputs.source_ref || 'feat/visual-physics-recovery-v020' }}

jobs:
  resolve-source:
    name: Resolve immutable private source
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Checkout requested private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.ROADBREAK_SOURCE_TOKEN }}
          fetch-depth: 1

      - name: Resolve immutable source SHA
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SOURCE_REF=$SOURCE_REF"
          echo "SOURCE_SHA=$SHA"

  visual-qa:
    needs: resolve-source
    name: Private source QA on public runner
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout private Roadbreak source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          token: ${{ secrets.ROADBREAK_SOURCE_TOKEN }}
          fetch-depth: 1

      - name: Record pinned source commit
        run: echo "SOURCE_SHA=${{ needs.resolve-source.outputs.source_sha }}" >> "$GITHUB_ENV"

      - name: Install QA runtime
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils wget unzip curl ca-certificates python3 python3-pil nodejs npm xz-utils

      - name: Download Godot 4.6.3
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Hydrate Terrain3D and CC0 PBR terrain
        env:
          ROADBREAK_TERRAIN_RES: "4k"
        run: |
          set -euo pipefail
          python3 tools/bootstrap_terrain3d.py
          test -s addons/terrain_3d/plugin.cfg
          test -s godot/assets/terrain/pbr/manifest.generated.json

      - name: Generate and validate Terrain3D world
        run: |
          set -euo pipefail
          mkdir -p ci/logs
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --import \
            2>&1 | tee ci/logs/terrain-v019-import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" ci/logs/terrain-v019-import.log
          timeout 360s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . \
            -s godot/tools/generate_terrain3d_data.gd 2>&1 | tee ci/logs/terrain-v019-generate.log
          grep -q "TERRAIN_V019_RESULT=PASS" ci/logs/terrain-v019-generate.log
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --import \
            2>&1 | tee ci/logs/terrain-v019-reimport.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" ci/logs/terrain-v019-reimport.log
          timeout 150s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . \
            -s godot/tests/terrain_v019_smoke.gd 2>&1 | tee ci/logs/terrain-v019-smoke.log
          grep -q "TERRAIN_V019_RESULT=PASS" ci/logs/terrain-v019-smoke.log

      - name: Hydrate large pinned CC0 assets
        run: |
          mkdir -p godot/assets/vehicles/cc0 godot/assets/drivers/cc0
          curl -fL --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/KhronosGroupArchives/glTF-Sample-Models/d7a3cc8e51d7c573771ae77a57f16b0662a905c6/2.0/ToyCar/glTF-Binary/ToyCar.glb" \
            -o godot/assets/vehicles/cc0/rattler_toycar.glb
          curl -fL --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/ingel81/3dtd/c169ba7c39112244174c04b292cefd82417c36ed/public/assets/models/hero/mercenary.glb" \
            -o godot/assets/drivers/cc0/driver_swat.glb
          test "$(stat -c%s godot/assets/vehicles/cc0/rattler_toycar.glb)" -gt 5000000
          test "$(stat -c%s godot/assets/drivers/cc0/driver_swat.glb)" -gt 1000000


      - name: Hydrate v0.20 production visual assets
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="20.19.5"
          NODE_ROOT="/tmp/roadbreak-node20"
          if [ ! -x "$NODE_ROOT/bin/node" ]; then
            rm -rf "$NODE_ROOT"
            mkdir -p "$NODE_ROOT"
            curl -fsSL --retry 4 --retry-delay 2 \
              "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
              -o /tmp/roadbreak-node20.tar.xz
            tar -xJf /tmp/roadbreak-node20.tar.xz --strip-components=1 -C "$NODE_ROOT"
          fi
          export PATH="$NODE_ROOT/bin:$PATH"
          node --version
          node --version | grep -q '^v20\.'
          npm install --global @gltf-transform/cli@4.5.1
          gltf-transform --version
          python3 tools/bootstrap_v020_visual_assets.py
          test -s godot/assets/external_v020/manifest.generated.json
          test -s godot/assets/vehicles/external_v020/wraith_sports_car.glb
          test -s godot/assets/vehicles/external_v020/mule_recovery.glb
          test -s godot/assets/vehicles/external_v020/specter_saloon.glb
          test -s godot/assets/vehicles/external_v020/warden_small_van.glb
          test -s godot/assets/environment/external_v020/hangar_arch.glb
          test -s godot/assets/environment/external_v020/hangar_end.glb

      - name: Prepare runtime-safe music assets
        run: |
          python3 tools/generate_music_assets.py
          test -s godot/assets/audio/music/garage.wav
          test -s godot/assets/audio/music/combat.wav
          test -s godot/assets/audio/music/result.wav

      - name: Validate v0.13 production assets
        run: |
          test -s godot/assets/vehicles/cc0/rattler_toycar.glb
          test -s godot/assets/vehicles/cc0/iron_bus_ajanhallinta.fbx
          test -s godot/assets/drivers/cc0/driver_swat.glb
          test -s godot/assets/drivers/cc0/driver_mara_street.glb
          test -s godot/assets/weapons/cc0/rattler_gatling.glb
          test -s godot/assets/audio/professional/rattler/engine_combustion.ogg
          test -s godot/assets/audio/professional/iron_bus/engine_combustion.ogg
          test -s godot/assets/audio/professional/weapons/minigun_loop.mp3
          test -s godot/assets/audio/professional/weapons/cannon_01.mp3
          test -s godot/assets/audio/professional/weapons/missile_launch_01.mp3
          test -s godot/assets/audio/professional/weapons/mortar_launch_01.mp3
          test -s godot/assets/audio/professional/impacts/metal_heavy_01.ogg
          test -s godot/assets/audio/professional/tires/asphalt_skid.ogg

      - name: Import and parse
        run: |
          mkdir -p ci/logs ci/previews
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --editor --quit \
            2>&1 | tee ci/logs/stage1-import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" ci/logs/stage1-import.log
          ! grep -E "KHR_mesh_quantization|Error importing 'res://godot/assets/(vehicles|environment)/external_v020" ci/logs/stage1-import.log

      - name: Run v0.18 compile/load gate
        run: |
          set -euo pipefail
          timeout 90s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --verbose --headless --path . -s godot/tests/compile_v018_smoke.gd \
            2>&1 | tee ci/logs/stage1-compile-v018.log
          grep -q "COMPILE_V018_RESULT=PASS" ci/logs/stage1-compile-v018.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" ci/logs/stage1-compile-v018.log

      - name: Run v0.13 content gate
        run: |
          set -euo pipefail
          timeout 75s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --verbose --headless --path . -s godot/tests/content_v013_smoke.gd \
            2>&1 | tee ci/logs/stage1-content-v013.log
          grep -q "CONTENT_V013_RESULT=PASS" ci/logs/stage1-content-v013.log
          grep -q "CONTENT_V013_RATTLER_RECORDED_ENGINE=PASS" ci/logs/stage1-content-v013.log
          grep -q "CONTENT_V013_MINIGUN_RECORDED_LOOP=PASS" ci/logs/stage1-content-v013.log
          grep -q "CONTENT_V013_RATTLER_MODEL_IMPORT=PASS" ci/logs/stage1-content-v013.log
          grep -q "CONTENT_V013_IRON_BUS_MODEL_IMPORT=PASS" ci/logs/stage1-content-v013.log

      - name: Run v0.17 production gate
        run: |
          set -euo pipefail
          timeout 180s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --verbose --headless --path . -s godot/tests/production_v017_smoke.gd \
            2>&1 | tee ci/logs/stage1-production-v017.log
          grep -q "PRODUCTION_V017_RESULT=PASS" ci/logs/stage1-production-v017.log
          grep -q "PRODUCTION_V017_ROSTER_SIZE_SIX=PASS" ci/logs/stage1-production-v017.log
          grep -q "PRODUCTION_V017_UNIQUE_PRIMARY_IDENTITIES=PASS" ci/logs/stage1-production-v017.log
          grep -q "PRODUCTION_V017_MUSIC_COMBAT_LOOP=PASS" ci/logs/stage1-production-v017.log

      - name: Run v0.18 audit behavioral gate
        run: |
          set -euo pipefail
          timeout 180s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --verbose --headless --path . -s godot/tests/audit_v018_smoke.gd \
            2>&1 | tee ci/logs/stage1-audit-v018.log
          grep -q "AUDIT_V018_RESULT=PASS" ci/logs/stage1-audit-v018.log
          grep -q "AUDIT_V018_PRIMARY_FIRES_IRON_BUS_24=PASS" ci/logs/stage1-audit-v018.log
          grep -q "AUDIT_V018_SHIELD_BLOCKS_ENGINE_DAMAGE=PASS" ci/logs/stage1-audit-v018.log
          grep -q "AUDIT_V018_AI_REPULSOR_DEFENSE_REQUEST=PASS" ci/logs/stage1-audit-v018.log
          grep -q "AUDIT_V018_MINE_OVERLAP_DETONATES_AFTER_ARM=PASS" ci/logs/stage1-audit-v018.log

      - name: Run touch and garage regression
        run: |
          set -euo pipefail
          timeout 120s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --verbose --headless --path . -s godot/tests/touch_regression.gd \
            2>&1 | tee ci/logs/stage1-touch.log
          grep -q "TOUCH_REGRESSION=PASS" ci/logs/stage1-touch.log
          grep -q "TOUCH_GARAGE_DEDICATED_3D_STAGE=PASS" ci/logs/stage1-touch.log
          grep -q "TOUCH_GARAGE_WEAPON_HARDPOINTS=PASS" ci/logs/stage1-touch.log
          grep -q "TOUCH_GARAGE_SWIPE_ROTATES_VEHICLE=PASS" ci/logs/stage1-touch.log
          grep -q "TOUCH_COMBAT_FLOATING_ORIGIN_NEUTRAL=PASS" ci/logs/stage1-touch.log

      - name: Run v0.20 visual physics recovery gate
        run: |
          set -euo pipefail
          timeout 180s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --verbose --headless --path . -s godot/tests/recovery_v020_smoke.gd \
            2>&1 | tee ci/logs/stage1-recovery-v020.log
          grep -q "RECOVERY_V020_RESULT=PASS" ci/logs/stage1-recovery-v020.log
          grep -q "RECOVERY_V020_TERRAIN_SAFETY_BODY=PASS" ci/logs/stage1-recovery-v020.log
          grep -q "RECOVERY_V020_TERRAIN3D_CAMERA_BOUND=PASS" ci/logs/stage1-recovery-v020.log
          grep -q "RECOVERY_V020_ROUTE_SCRAP_COLLISIONS=PASS" ci/logs/stage1-recovery-v020.log
          grep -q "RECOVERY_V020_RATTLER_GATLING_FORWARD_AXIS=PASS" ci/logs/stage1-recovery-v020.log
          grep -q "RECOVERY_V020_AMVLAB_A320_ASSET=PASS" ci/logs/stage1-recovery-v020.log
          grep -q "RECOVERY_V020_AUTHORED_WRECK_A320_WEST=PASS" ci/logs/stage1-recovery-v020.log
          grep -q "RECOVERY_V020_GARAGE_MULE_SAFE_FRAMING=PASS" ci/logs/stage1-recovery-v020.log

      - name: Render dedicated garage QA
        run: |
          set -euo pipefail
          rm -f ci/previews/00_garage_*.png
          timeout 70s xvfb-run -a -s "-screen 0 1280x720x24" \
            env ROADBREAK_GARAGE_CAPTURE=1 LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --path . res://godot/scenes/garage.tscn \
            --rendering-method gl_compatibility --display-driver x11 --audio-driver Dummy \
            2>&1 | tee ci/logs/stage1-garage.log
          grep -q "CI_GARAGE_CAPTURE=PASS" ci/logs/stage1-garage.log
          test -s ci/previews/00_garage_main.png
          test -s ci/previews/00_garage_workshop.png
          test -s ci/previews/00_garage_driver.png
          test -s ci/previews/00_roster_rattler_73.png
          test -s ci/previews/00_roster_iron_bus_24.png
          test -s ci/previews/00_roster_selena_cross.png
          test -s ci/previews/00_roster_bruno_kane.png
          test -s ci/previews/00_roster_dorian_vale.png
          test -s ci/previews/00_roster_nyra_holt.png

      - name: Render gameplay QA
        run: |
          set -euo pipefail
          timeout 115s xvfb-run -a -s "-screen 0 1280x720x24" \
            env ROADBREAK_CI_CAPTURE=1 LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --path . res://godot/scenes/main.tscn \
            --rendering-method gl_compatibility --display-driver x11 --audio-driver Dummy \
            2>&1 | tee ci/logs/stage1-gameplay.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Invalid call\.|Invalid type in function|Invalid access to property|Failed to load script" ci/logs/stage1-gameplay.log
          grep -q "CI_SMOKE_RESULT=PASS" ci/logs/stage1-gameplay.log
          test -s ci/previews/01_chase.png
          test -s ci/previews/02_vehicle.png
          test -s ci/previews/03_graveyard_overview.png
          test -s ci/previews/06_mobile_controls.png
          test -s ci/previews/08_aircraft_corridor.png
          test -s ci/previews/09_fire_hangar.png
          test -s ci/previews/11_ground_detail.png
          test -s ci/previews/12_perimeter_hills.png
          test -s ci/previews/14_wreck_detail.png

      - name: Mirror QA previews into Stage1 repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for file in \
            ci/previews/00_garage_main.png \
            ci/previews/00_garage_workshop.png \
            ci/previews/00_garage_driver.png \
            ci/previews/00_roster_rattler_73.png \
            ci/previews/00_roster_iron_bus_24.png \
            ci/previews/00_roster_selena_cross.png \
            ci/previews/00_roster_bruno_kane.png \
            ci/previews/00_roster_dorian_vale.png \
            ci/previews/00_roster_nyra_holt.png \
            ci/previews/01_chase.png \
            ci/previews/02_vehicle.png \
            ci/previews/04_rival_bus.png \
            ci/previews/06_mobile_controls.png \
            ci/previews/03_graveyard_overview.png \
            ci/previews/08_aircraft_corridor.png \
            ci/previews/09_fire_hangar.png \
            ci/previews/11_ground_detail.png \
            ci/previews/12_perimeter_hills.png \
            ci/previews/14_wreck_detail.png; do
            test -s "$file"
            name="$(basename "$file")"
            path="qa/latest/$name"
            existing="$(curl -sS "${AUTH[@]}" "$API/contents/$path?ref=main")"
            sha="$(printf '%s' "$existing" | jq -r '.sha // empty' 2>/dev/null || true)"
            base64 -w 0 "$file" > /tmp/qa-content.b64
            if [ -n "$sha" ]; then
              jq -n --arg msg "qa: refresh $name" --arg branch "main" --arg sha "$sha" --rawfile content /tmp/qa-content.b64 \
                '{message:$msg,content:$content,branch:$branch,sha:$sha}' > /tmp/qa-payload.json
            else
              jq -n --arg msg "qa: publish $name" --arg branch "main" --rawfile content /tmp/qa-content.b64 \
                '{message:$msg,content:$content,branch:$branch}' > /tmp/qa-payload.json
            fi
            curl -fsS -X PUT "${AUTH[@]}" -H "Content-Type: application/json" --data-binary @/tmp/qa-payload.json "$API/contents/$path" >/dev/null

            thumb="/tmp/qa-${name%.png}.jpg"
            python3 - "$file" "$thumb" <<'PY'
from PIL import Image
from pathlib import Path
import sys
src, dst = map(Path, sys.argv[1:3])
with Image.open(src) as im:
    im = im.convert("RGB")
    max_width = 800
    if im.width > max_width:
        im = im.resize((max_width, max(1, round(im.height * max_width / im.width))), Image.Resampling.LANCZOS)
    im.save(dst, "JPEG", quality=78, optimize=True, progressive=True)
PY
            thumb_name="${name%.png}.jpg"
            thumb_path="qa/thumbs/$thumb_name"
            thumb_existing="$(curl -sS "${AUTH[@]}" "$API/contents/$thumb_path?ref=main")"
            thumb_sha="$(printf '%s' "$thumb_existing" | jq -r '.sha // empty' 2>/dev/null || true)"
            base64 -w 0 "$thumb" > /tmp/qa-thumb-content.b64
            if [ -n "$thumb_sha" ]; then
              jq -n --arg msg "qa: refresh $thumb_name" --arg branch "main" --arg sha "$thumb_sha" --rawfile content /tmp/qa-thumb-content.b64 \
                '{message:$msg,content:$content,branch:$branch,sha:$sha}' > /tmp/qa-thumb-payload.json
            else
              jq -n --arg msg "qa: publish $thumb_name" --arg branch "main" --rawfile content /tmp/qa-thumb-content.b64 \
                '{message:$msg,content:$content,branch:$branch}' > /tmp/qa-thumb-payload.json
            fi
            curl -fsS -X PUT "${AUTH[@]}" -H "Content-Type: application/json" --data-binary @/tmp/qa-thumb-payload.json "$API/contents/$thumb_path" >/dev/null
          done

      - name: Publish QA preview images to Release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          TAG="roadbreak-v020-recovery-qa-latest"

          EXISTING="$(curl -sS "${AUTH[@]}" "$API/releases/tags/$TAG")"
          RELEASE_ID="$(printf '%s' "$EXISTING" | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            curl -fsS -X DELETE "${AUTH[@]}" "$API/releases/$RELEASE_ID"
          fi
          curl -sS -o /dev/null -X DELETE "${AUTH[@]}" "$API/git/refs/tags/$TAG" || true

          PAYLOAD="$(jq -n             --arg tag "$TAG"             --arg target "$GITHUB_SHA"             --arg name "Roadbreak 75 — v0.20 Recovery QA previews"             --arg body "Ephemeral-style QA previews persisted as GitHub Release assets, not Actions artifacts. Source ref: $SOURCE_REF. Pinned source SHA: $SOURCE_SHA."             '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:true}')"

          RELEASE="$(curl -fsS -X POST "${AUTH[@]}" -H "Content-Type: application/json" -d "$PAYLOAD" "$API/releases")"
          NEW_ID="$(printf '%s' "$RELEASE" | jq -r '.id')"
          test "$NEW_ID" != "null"

          for file in             ci/previews/00_garage_main.png             ci/previews/00_garage_workshop.png             ci/previews/00_garage_driver.png             ci/previews/00_roster_rattler_73.png             ci/previews/00_roster_iron_bus_24.png             ci/previews/00_roster_selena_cross.png             ci/previews/00_roster_bruno_kane.png             ci/previews/00_roster_dorian_vale.png             ci/previews/00_roster_nyra_holt.png             ci/previews/01_chase.png             ci/previews/02_vehicle.png             ci/previews/04_rival_bus.png             ci/previews/06_mobile_controls.png             ci/previews/03_graveyard_overview.png             ci/previews/08_aircraft_corridor.png             ci/previews/09_fire_hangar.png             ci/previews/11_ground_detail.png             ci/previews/12_perimeter_hills.png             ci/previews/14_wreck_detail.png; do
            test -s "$file"
            name="$(basename "$file")"
            curl -fsS -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "Content-Type: image/png"               --data-binary "@$file"               "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$NEW_ID/assets?name=$name"
          done

      - name: Keep QA ephemeral
        if: always()
        run: |
          echo "Stage1 validated source ${SOURCE_REPOSITORY}@${SOURCE_SHA:-unknown}."
          echo "QA screenshots are persisted only as Release assets; no Actions artifacts are created."

  build-android:
    name: Build and publish Android APK
    # The Android job has its own Terrain3D, compile and gameplay regression gates.
    # Keep it independent from screenshot rendering so a previously validated source
    # does not wait for visual QA before producing the prerelease APK.
    needs: [resolve-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.6.3

    steps:
      - name: Checkout private Roadbreak source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          token: ${{ secrets.ROADBREAK_SOURCE_TOKEN }}
          fetch-depth: 1

      - name: Record pinned source commit
        run: echo "SOURCE_SHA=${{ needs.resolve-source.outputs.source_sha }}" >> "$GITHUB_ENV"

      - name: Hydrate large pinned CC0 assets
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates python3 python3-pil unzip nodejs npm xz-utils
          mkdir -p godot/assets/vehicles/cc0 godot/assets/drivers/cc0
          curl -fL --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/KhronosGroupArchives/glTF-Sample-Models/d7a3cc8e51d7c573771ae77a57f16b0662a905c6/2.0/ToyCar/glTF-Binary/ToyCar.glb" \
            -o godot/assets/vehicles/cc0/rattler_toycar.glb
          curl -fL --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/ingel81/3dtd/c169ba7c39112244174c04b292cefd82417c36ed/public/assets/models/hero/mercenary.glb" \
            -o godot/assets/drivers/cc0/driver_swat.glb
          test "$(stat -c%s godot/assets/vehicles/cc0/rattler_toycar.glb)" -gt 5000000
          test "$(stat -c%s godot/assets/drivers/cc0/driver_swat.glb)" -gt 1000000
          rm -rf /var/lib/apt/lists/*

      - name: Hydrate Terrain3D and CC0 PBR terrain
        shell: bash
        env:
          ROADBREAK_TERRAIN_RES: "4k"
        run: |
          set -euo pipefail
          python3 tools/bootstrap_terrain3d.py
          test -s addons/terrain_3d/plugin.cfg
          test -s godot/assets/terrain/pbr/manifest.generated.json

      - name: Generate and validate Terrain3D world
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/terrain-v019-import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" /tmp/terrain-v019-import.log
          timeout 360s godot --headless --path . -s godot/tools/generate_terrain3d_data.gd \
            2>&1 | tee /tmp/terrain-v019-generate.log
          grep -q "TERRAIN_V019_RESULT=PASS" /tmp/terrain-v019-generate.log
          godot --headless --path . --import 2>&1 | tee /tmp/terrain-v019-reimport.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" /tmp/terrain-v019-reimport.log
          timeout 150s godot --headless --path . -s godot/tests/terrain_v019_smoke.gd \
            2>&1 | tee /tmp/terrain-v019-smoke.log
          grep -q "TERRAIN_V019_RESULT=PASS" /tmp/terrain-v019-smoke.log


      - name: Hydrate v0.20 production visual assets
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="20.19.5"
          NODE_ROOT="/tmp/roadbreak-node20"
          if [ ! -x "$NODE_ROOT/bin/node" ]; then
            rm -rf "$NODE_ROOT"
            mkdir -p "$NODE_ROOT"
            curl -fsSL --retry 4 --retry-delay 2 \
              "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
              -o /tmp/roadbreak-node20.tar.xz
            tar -xJf /tmp/roadbreak-node20.tar.xz --strip-components=1 -C "$NODE_ROOT"
          fi
          export PATH="$NODE_ROOT/bin:$PATH"
          node --version
          node --version | grep -q '^v20\.'
          npm install --global @gltf-transform/cli@4.5.1
          gltf-transform --version
          python3 tools/bootstrap_v020_visual_assets.py
          test -s godot/assets/external_v020/manifest.generated.json
          test -s godot/assets/vehicles/external_v020/wraith_sports_car.glb
          test -s godot/assets/vehicles/external_v020/mule_recovery.glb
          test -s godot/assets/vehicles/external_v020/specter_saloon.glb
          test -s godot/assets/vehicles/external_v020/warden_small_van.glb
          test -s godot/assets/environment/external_v020/hangar_arch.glb
          test -s godot/assets/environment/external_v020/hangar_end.glb

      - name: Prepare runtime-safe music assets
        run: |
          python3 tools/generate_music_assets.py
          test -s godot/assets/audio/music/garage.wav
          test -s godot/assets/audio/music/combat.wav
          test -s godot/assets/audio/music/result.wav

      - name: Validate v0.13 production assets
        run: |
          test -s godot/assets/vehicles/cc0/rattler_toycar.glb
          test -s godot/assets/vehicles/cc0/iron_bus_ajanhallinta.fbx
          test -s godot/assets/drivers/cc0/driver_swat.glb
          test -s godot/assets/drivers/cc0/driver_mara_street.glb
          test -s godot/assets/weapons/cc0/rattler_gatling.glb
          test -s godot/assets/audio/professional/rattler/engine_combustion.ogg
          test -s godot/assets/audio/professional/iron_bus/engine_combustion.ogg
          test -s godot/assets/audio/professional/weapons/minigun_loop.mp3

      - name: Configure Godot paths
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"
          if [ -d "/root/.local/share/godot/export_templates/$GODOT_VERSION.stable" ]; then
            cp -r "/root/.local/share/godot/export_templates/$GODOT_VERSION.stable" "$HOME/.local/share/godot/export_templates/"
          fi
          if [ -f "/root/.config/godot/editor_settings-4.6.tres" ]; then
            cp "/root/.config/godot/editor_settings-4.6.tres" "$HOME/.config/godot/"
          fi

      - name: Parse and regression gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/stage1-import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|KHR_mesh_quantization|Error importing 'res://godot/assets/(vehicles|environment)/external_v020" /tmp/stage1-import.log
          timeout 90s godot --headless --path . -s godot/tests/compile_v018_smoke.gd \
            2>&1 | tee /tmp/compile-v018.log
          grep -q "COMPILE_V018_RESULT=PASS" /tmp/compile-v018.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" /tmp/compile-v018.log
          timeout 75s godot --headless --path . -s godot/tests/content_v013_smoke.gd \
            2>&1 | tee /tmp/content-v013.log
          grep -q "CONTENT_V013_RESULT=PASS" /tmp/content-v013.log
          timeout 180s godot --headless --path . -s godot/tests/production_v017_smoke.gd \
            2>&1 | tee /tmp/production-v017.log
          grep -q "PRODUCTION_V017_RESULT=PASS" /tmp/production-v017.log
          timeout 180s godot --headless --path . -s godot/tests/audit_v018_smoke.gd \
            2>&1 | tee /tmp/audit-v018.log
          grep -q "AUDIT_V018_RESULT=PASS" /tmp/audit-v018.log
          timeout 120s godot --headless --path . -s godot/tests/touch_regression.gd \
            2>&1 | tee /tmp/touch-regression.log
          grep -q "TOUCH_REGRESSION=PASS" /tmp/touch-regression.log
          grep -q "TOUCH_GARAGE_SWIPE_ROTATES_VEHICLE=PASS" /tmp/touch-regression.log
          grep -q "TOUCH_COMBAT_FLOATING_ORIGIN_NEUTRAL=PASS" /tmp/touch-regression.log
          timeout 180s godot --headless --path . -s godot/tests/recovery_v020_smoke.gd \
            2>&1 | tee /tmp/recovery-v020.log
          grep -q "RECOVERY_V020_RESULT=PASS" /tmp/recovery-v020.log
          grep -q "RECOVERY_V020_AMVLAB_A320_ASSET=PASS" /tmp/recovery-v020.log
          grep -q "RECOVERY_V020_GARAGE_MULE_SAFE_FRAMING=PASS" /tmp/recovery-v020.log

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Android Debug" "$GITHUB_WORKSPACE/build/android/$APK_NAME"
          test -s "build/android/$APK_NAME"

      - name: Verify Android APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/build/android/$APK_NAME"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK" | tee build/android/apksigner.txt

          # Legacy aapt 33 returns non-zero on SDK 36 typed manifest attributes,
          # even while emitting usable package/version metadata. Capture its output
          # without treating that parser incompatibility as an APK failure.
          set +e
          "$AAPT" dump badging "$APK" > build/android/badging.txt 2> build/android/aapt-badging.err
          AAPT_STATUS=$?
          set -e
          cat build/android/aapt-badging.err || true
          cat build/android/badging.txt

          grep -q "package: name='com.cybertran.roadbreak75'" build/android/badging.txt
          grep -q "versionCode='24'" build/android/badging.txt
          grep -q "versionName='0.20.0-dev2'" build/android/badging.txt

          unzip -l "$APK" > build/android/apk-listing.txt
          grep -q "lib/arm64-v8a/" build/android/apk-listing.txt
          grep -q "window/handheld/orientation=4" project.godot

          echo "AAPT_BADGING_STATUS=$AAPT_STATUS"
          sha256sum "$APK" | tee build/android/$APK_NAME.sha256
          echo "APK_VERIFY=PASS"

      - name: Install release publishing tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl jq
          rm -rf /var/lib/apt/lists/*

      - name: Publish Stage1 Android release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          TAG="roadbreak-v020-recovery-latest"
          RELEASE_NAME="Roadbreak 75 — v0.20.0-dev2 Recovery"

          EXISTING="$(curl -sS "${AUTH[@]}" "$API/releases/tags/$TAG")"
          RELEASE_ID="$(printf '%s' "$EXISTING" | jq -r '.id // empty')"
          if [ -n "$RELEASE_ID" ]; then
            curl -fsS -X DELETE "${AUTH[@]}" "$API/releases/$RELEASE_ID"
          fi
          curl -sS -o /dev/null -X DELETE "${AUTH[@]}" "$API/git/refs/tags/$TAG" || true

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          BODY="Public-runner Android build from private source ref $SOURCE_REF pinned to immutable SHA $SOURCE_SHA. v0.20.0-dev2 is the visually-audited recovery build. It keeps the dev1 physics/input fixes and raises the art bar with stronger central terrain relief, irregular feathered Terrain3D material transitions, detailed CC0 secondary vehicle donors, restrained role-specific combat dressing, dedicated Iron Bus armor, tighter Rattler gatling integration, authored attributed A320/B737 graveyard donors, improved hangars, larger layered fire/smoke and safer garage framing, while retaining the 256m Terrain3D collision window bound to the chase camera plus deterministic safety collision. The dedicated v0.20 recovery gate runs before publication."

          PAYLOAD="$(jq -n \
            --arg tag "$TAG" \
            --arg target "$GITHUB_SHA" \
            --arg name "$RELEASE_NAME" \
            --arg body "$BODY" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:true}')"

          RELEASE="$(curl -fsS -X POST "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$API/releases")"

          NEW_ID="$(printf '%s' "$RELEASE" | jq -r '.id')"
          test "$NEW_ID" != "null"

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@build/android/$APK_NAME" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$NEW_ID/assets?name=$APK_NAME"

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: text/plain" \
            --data-binary "@build/android/$APK_NAME.sha256" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$NEW_ID/assets?name=$APK_NAME.sha256"
